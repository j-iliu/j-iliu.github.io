<!DOCTYPE html>
<html>
<head>
    <title>My Projects</title>
    <style>
        :root {
            --ink: #1c1c1c;
            --muted: #6b6b6b;
            --line: #e4e4e4;
            --bg: #f2ede3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0 auto;
            max-width: 820px;
            padding: 80px 24px;
            color: var(--ink);
            background: var(--bg);
        }
        h1 {
            font-size: 1.9em;
            font-weight: 600;
            margin: 0 0 32px;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li + li {
            margin-top: 10px;
        }
        a {
            display: block;
            padding: 14px 18px;
            border: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            border-color: var(--muted);
            background: #fff;
        }
    </style>
</head>
<body>
    <h1>My CS180 Projects</h1>
    <ul>
        <li><a href="./0/index.html">Project 0</a></li>
    </ul>
</body>
</html>
